# ===================================================================
# Noesis - Autonomous AI Issue Triage Configuration
# ===================================================================

spring.application.name=noesis

# Server Configuration
server.port=8080

# Redis Vector & Cache Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5000ms

# LiteLLM Proxy / AI Gateway Configuration
lite-llm.base.url=${LITE_LLM_BASE_URL:http://localhost:4000}
lite-llm.api.key=${LITE_LLM_API_KEY:}

# GitHub Integration
github.token=${GITHUB_TOKEN:}

# Slack Alerting Webhook
slack.webhook.url=${SLACK_WEBHOOK_URL:${SLACK_WEBHOOK:https://hooks.slack.com/services/mock}}

# Noesis Specific Pipeline Tuning
noesis.pipeline.top-k-similar=3
noesis.pipeline.similarity-threshold=0.65
noesis.pipeline.max-summary-length=500
noesis.cache.labels-ttl-seconds=3600
noesis.cache.issues-ttl-seconds=1800

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
